<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Орфографический анализ | ОГЭ задание 6 | 10 вопросов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 20% 30%, #1a1a2e, #0a0a1a);
            color: #eef4ff;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            line-height: 1.5;
        }

        .glow-sphere {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }
        .sphere-1 { width: 55vw; height: 55vw; top: -30vh; left: -20vw; background: #2b4a7a; }
        .sphere-2 { width: 50vw; height: 50vw; bottom: -30vh; right: -10vw; background: #4a2a5a; }
        .sphere-3 { width: 40vw; height: 40vw; top: 50%; left: 50%; background: #7a4e2b; }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .glass-card {
            background: rgba(20, 25, 45, 0.55);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #b0c4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .sub {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 1.5rem;
        }

        .quiz-question {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border-left: 4px solid #6c8cff;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .q-num {
            background: #6c8cff;
            color: #0a0a1a;
            font-weight: bold;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
        }
        .question-text {
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 1rem 0;
            background: rgba(0,0,0,0.25);
            padding: 1rem;
            border-radius: 1rem;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin: 1rem 0 0.5rem;
        }
        .opt-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(108, 140, 255, 0.3);
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            color: #eef4ff;
            display: inline-block;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(108, 140, 255, 0.4);
            border-radius: 2rem;
            padding: 0.6rem 1.4rem;
            cursor: pointer;
            transition: 0.2s;
            color: #eef4ff;
            font-weight: 500;
        }
        .btn-primary {
            background: #6c8cff;
            border-color: #6c8cff;
            color: #0a0a1a;
            font-weight: bold;
        }
        .btn:hover {
            background: rgba(108, 140, 255, 0.3);
        }
        .btn-primary:hover {
            background: #8aa8ff;
        }
        .progress {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.8rem;
            opacity: 0.6;
        }
        hr {
            margin: 1rem 0;
            border-color: rgba(255,255,255,0.05);
        }
        @media (max-width: 700px) {
            body { padding: 1rem; }
            .question-text { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="glow-sphere sphere-1"></div>
<div class="glow-sphere sphere-2"></div>
<div class="glow-sphere sphere-3"></div>

<div class="container" id="app"></div>

<script>
    // ========= 10 РЕАЛЬНЫХ ВОПРОСОВ (ОГЭ, задание 6) =========
    const QUESTIONS = [
        { text: "1) НЕКОТОРЫЙ — в неопределённом местоимении без ударения пишется приставка НЕ-.<br>2) ПОЛ-ЛИСТА — пишется через дефис, потому что после пол- стоит буква л.<br>3) НЕУДАЧНЫЙ — имя прилагательное пишется с НЕ слитно, потому что слово не употребляется без НЕ.<br>4) НЕНАВИДЯЩИЙ — в суффиксе действительного причастия настоящего времени, образованного от глагола II спряжения, пишется буква Я.<br>5) СКОШЕННЫЙ (луг) — в полном страдательном причастии прошедшего времени совершенного вида пишется НН." },
        { text: "1) РАСПИЛИТЬ — на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.<br>2) НОЧНОЙ — в сочетании ЧН буква Ь не пишется.<br>3) СКАКАТЬ — написание безударной чередующейся гласной в корне зависит от суффикса -А-.<br>4) РАЗВЕЯННЫЙ — написание гласной Я перед НН зависит от принадлежности к спряжению глагола.<br>5) НЕДОРОГОЕ (изделие) — имя прилагательное пишется с НЕ слитно, потому что его можно заменить синонимом без НЕ." },
        { text: "1) БЛЕСТИТ — написание безударной чередующейся гласной в корне зависит от последующих согласных.<br>2) В ТЕЧЕНИЕ (суток) — на конце производного предлога пишется буква Е.<br>3) (тема) УСВОЕНА — в суффиксе краткого страдательного причастия прошедшего времени пишется одна буква Н.<br>4) ПРИДУМАТЬ — написание приставки определяется её значением — расположение вблизи.<br>5) СБЕРЕЧЬ — на конце глагола в повелительном наклонении после шипящих пишется буква Ь." },
        { text: "1) (знания) УСВОЕНЫ — в суффиксе краткого страдательного причастия прошедшего времени пишется одна буква Н.<br>2) ГОРЯЧО (благодарить) — в окончании наречий после шипящих под ударением пишется буква О.<br>3) УКРОЩАТЬ (животных) — в корне слова пишется непроверяемая гласная.<br>4) НЕНАСТНЫЙ — непроизносимый согласный в корне слова проверяется словом ненастье.<br>5) БЕЗЫМЯННЫЙ — после русской приставки, оканчивающейся на согласный, пишется буква Ы." },
        { text: "1) ОТДАТЬ — на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква Т.<br>2) ПРИМЕРЯТЬ (платье) — написание безударной гласной в корне проверяется подбором однокоренного слова, в котором проверяемый гласный находится в ударном слоге.<br>3) ПОДДЕРЖАННЫЙ (друзьями) — в имени прилагательном, образованном от глагола несовершенного вида, пишется НН.<br>4) МОРЕХОДНЫЙ — в сложном слове после мягкого согласного пишется соединительная гласная Е.<br>5) НЕВЗРАЧНЫЙ — НЕ пишется слитно с именем прилагательным, которое не употребляется без НЕ." },
        { text: "1) ПРИТОРМОЗИТЬ — написание приставки определяется её значением — присоединение.<br>2) ЛЬНЯНОЙ — в суффиксе прилагательного, образованного от существительного с помощью суффикса -ЯН-, пишется одна буква Н.<br>3) В АКВАРИУМЕ — в форме дательного падежа единственного числа имени существительного 2-го склонения пишется окончание -Е.<br>4) НЕ С КЕМ — НЕ с притяжательными местоимениями пишется раздельно.<br>5) БЕСШУМНЫЙ — на конце приставки перед буквой, обозначающей глухой согласный, пишется буква С." },
        { text: "1) ПО-ПРЕЖНЕМУ (тепло)— написание наречия через дефис определяется наличием приставки ПО- и суффикса -ЕМУ.<br>2) ПОТЕРЯТЬ — написание безударной чередующейся гласной в корне определяется наличием суффикса -А-.<br>3) НЕ ГОТОВ — частица НЕ с глаголом пишется раздельно.<br>4) БЕЗВИННЫЙ — в имени прилагательном, образованном от имени существительного с основой на -Н с помощью суффикса -Н-, пишется НН.<br>5) ПРИОСТАНОВИТЬ (работу) — написание приставки определяется её значением — расположение вблизи." },
        { text: "1) ИСПЕЧЬ — на конце неопределённой формы глагола после шипящих пишется буква Ь.<br>2) ЧЬИ-ТО (следы) — буква Ь обозначает мягкость предыдущего согласного.<br>3) ИЗВЕСТНЫЙ — непроизносимая согласная в корне слова проверяется словом известен.<br>4) ДОСРОЧНО — в наречии написание суффикса зависит от ударения.<br>5) ПРЕГРАЖДАТЬ — написание приставки определяется её значением, близким к слову очень." },
        { text: "1) ЗАГОРАТЬ — написание безударной чередующейся гласной в корне определяется наличием суффикса -А-.<br>2) НОЧЬЮ (уехать) — в наречии буква Ь указывает на мягкость предшествующего согласного.<br>3) РАРИТЕТ — в корне слова пишутся непроверяемые безударные гласные.<br>4) ЛЕЛЕЮТ (ребёнка) — в форме настоящего времени 3-го лица множественного числа глагола I спряжения пишется окончание -ЮТ.<br>5) КАЛАЧОМ — в суффиксе имени существительного под ударением пишется буква О." },
        { text: "1) ВСТРЕЧЕННЫЙ — в полном страдательном причастии прошедшего времени совершенного вида пишется НН.<br>2) ПРИПОДНЯТЬ — написание приставки определяется её значением — неполнота действия.<br>3) ВЬЮГА — буква Ь обозначает мягкость предшествующего согласного.<br>4) ВОСХИЩАТЬСЯ — на конце приставки перед буквой, обозначающей звонкий согласный, пишется буква С.<br>5) СОРОКАЛЕТНИЙ — сложное числительное пишется слитно." }
    ];

    const TOTAL = QUESTIONS.length;
    let currentIndex = 0;

    const appDiv = document.getElementById("app");

    function render() {
        const q = QUESTIONS[currentIndex];
        // Разбиваем варианты по строкам (цифры 1–5)
        const optionsHtml = `
            <div class="options">
                <span class="opt-item">1</span>
                <span class="opt-item">2</span>
                <span class="opt-item">3</span>
                <span class="opt-item">4</span>
                <span class="opt-item">5</span>
            </div>
        `;
        const html = `
            <div class="glass-card">
                <div class="quiz-question">
                    <div class="question-header">
                        <span class="q-num">Вопрос ${currentIndex+1} / ${TOTAL}</span>
                        <span class="q-type">📝 Орфографический анализ</span>
                    </div>
                    <div class="question-text">${q.text}</div>
                    ${optionsHtml}
                    <div class="nav-buttons">
                        <button id="prevBtn" class="btn" ${currentIndex === 0 ? 'disabled' : ''}>◀ Назад</button>
                        <button id="nextBtn" class="btn btn-primary">${currentIndex === TOTAL-1 ? '🏁 Завершить' : 'Следующий →'}</button>
                    </div>
                    <div class="progress">📌 Запишите номера верных ответов на листочек</div>
                </div>
            </div>
        `;
        appDiv.innerHTML = html;

        document.getElementById("prevBtn")?.addEventListener("click", () => {
            if (currentIndex > 0) {
                currentIndex--;
                render();
            }
        });
        document.getElementById("nextBtn")?.addEventListener("click", () => {
            if (currentIndex < TOTAL - 1) {
                currentIndex++;
                render();
            } else {
                // финальный экран
                appDiv.innerHTML = `
                    <div class="glass-card" style="text-align:center;">
                        <div style="font-size:1.6rem; font-weight:800;">📋 Готово!</div>
                        <div style="margin:1rem 0;">Вы просмотрели все ${TOTAL} вопросов.</div>
                        <button id="restartBtn" class="btn btn-primary">🔄 Начать заново</button>
                    </div>
                `;
                document.getElementById("restartBtn")?.addEventListener("click", () => {
                    currentIndex = 0;
                    render();
                });
            }
        });
    }

    render();
</script>
</body>
</html>
