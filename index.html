<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Орфографический анализ | ОГЭ задание 6 | 10 вопросов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 20% 30%, #1a1a2e, #0a0a1a);
            color: #eef4ff;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            line-height: 1.5;
        }

        .glow-sphere {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }
        .sphere-1 { width: 55vw; height: 55vw; top: -30vh; left: -20vw; background: #2b4a7a; }
        .sphere-2 { width: 50vw; height: 50vw; bottom: -30vh; right: -10vw; background: #4a2a5a; }
        .sphere-3 { width: 40vw; height: 40vw; top: 50%; left: 50%; background: #7a4e2b; }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .glass-card {
            background: rgba(20, 25, 45, 0.55);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #b0c4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .sub {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 1.5rem;
        }

        .quiz-question {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border-left: 4px solid #6c8cff;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .q-num {
            background: #6c8cff;
            color: #0a0a1a;
            font-weight: bold;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
        }
        .question-text {
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 1rem 0;
            background: rgba(0,0,0,0.25);
            padding: 1rem;
            border-radius: 1rem;
        }
        .options-list {
            margin: 1rem 0 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .option-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(108, 140, 255, 0.3);
            border-radius: 1rem;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            color: #eef4ff;
            line-height: 1.4;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(108, 140, 255, 0.4);
            border-radius: 2rem;
            padding: 0.6rem 1.4rem;
            cursor: pointer;
            transition: 0.2s;
            color: #eef4ff;
            font-weight: 500;
        }
        .btn-primary {
            background: #6c8cff;
            border-color: #6c8cff;
            color: #0a0a1a;
            font-weight: bold;
        }
        .btn:hover {
            background: rgba(108, 140, 255, 0.3);
        }
        .btn-primary:hover {
            background: #8aa8ff;
        }
        .progress {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.8rem;
            opacity: 0.6;
        }
        @media (max-width: 700px) {
            body { padding: 1rem; }
            .question-text { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="glow-sphere sphere-1"></div>
<div class="glow-sphere sphere-2"></div>
<div class="glow-sphere sphere-3"></div>

<div class="container" id="app"></div>

<script>
    // ========= 10 РЕАЛЬНЫХ ВОПРОСОВ (ОГЭ, задание 6) =========
    const QUESTIONS = [
        { 
            text: "Укажите варианты ответов, в которых дано верное объяснение написания выделенного слова.",
            options: [
                "НЕКОТОРЫЙ — в неопределённом местоимении без ударения пишется приставка НЕ-.",
                "ПОЛ-ЛИСТА — пишется через дефис, потому что после пол- стоит буква л.",
                "НЕУДАЧНЫЙ — имя прилагательное пишется с НЕ слитно, потому что слово не употребляется без НЕ.",
                "НЕНАВИДЯЩИЙ — в суффиксе действительного причастия настоящего времени, образованного от глагола II спряжения, пишется буква Я.",
                "СКОШЕННЫЙ (луг) — в полном страдательном причастии прошедшего времени совершенного вида пишется НН."
            ]
        },
        { 
            text: "Укажите варианты ответов, в которых дано верное объяснение написания выделенного слова.",
            options: [
                "РАСПИЛИТЬ — на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква С.",
                "НОЧНОЙ — в сочетании ЧН буква Ь не пишется.",
                "СКАКАТЬ — написание безударной чередующейся гласной в корне зависит от суффикса -А-.",
                "РАЗВЕЯННЫЙ — написание гласной Я перед НН зависит от принадлежности к спряжению глагола.",
                "НЕДОРОГОЕ (изделие) — имя прилагательное пишется с НЕ слитно, потому что его можно заменить синонимом без НЕ."
            ]
        },
        { 
            text: "Укажите варианты ответов, в которых дано верное объяснение написания выделенного слова.",
            options: [
                "БЛЕСТИТ — написание безударной чередующейся гласной в корне зависит от последующих согласных.",
                "В ТЕЧЕНИЕ (суток) — на конце производного предлога пишется буква Е.",
                "(тема) УСВОЕНА — в суффиксе краткого страдательного причастия прошедшего времени пишется одна буква Н.",
                "ПРИДУМАТЬ — написание приставки определяется её значением — расположение вблизи.",
                "СБЕРЕЧЬ — на конце глагола в повелительном наклонении после шипящих пишется буква Ь."
            ]
        },
        { 
            text: "Укажите варианты ответов, в которых дано верное объяснение написания выделенного слова.",
            options: [
                "(знания) УСВОЕНЫ — в суффиксе краткого страдательного причастия прошедшего времени пишется одна буква Н.",
                "ГОРЯЧО (благодарить) — в окончании наречий после шипящих под ударением пишется буква О.",
                "УКРОЩАТЬ (животных) — в корне слова пишется непроверяемая гласная.",
                "НЕНАСТНЫЙ — непроизносимый согласный в корне слова проверяется словом ненастье.",
                "БЕЗЫМЯННЫЙ — после русской приставки, оканчивающейся на согласный, пишется буква Ы."
            ]
        },
        { 
            text: "Укажите варианты ответов, в которых дано верное объяснение написания выделенного слова.",
            options: [
                "ОТДАТЬ — на конце приставки перед буквой, обозначающей глухой согласный звук, пишется буква Т.",
                "ПРИМЕРЯТЬ (платье) — написание безударной гласной в корне проверяется подбором однокоренного слова, в котором проверяемый гласный находится в ударном слоге.",
                "ПОДДЕРЖАННЫЙ (друзьями) — в имени прилагательном, образованном от глагола несовершенного вида, пишется НН.",
                "МОРЕХОДНЫЙ — в сложном слове после мягкого согласного пишется соединительная гласная Е.",
                "НЕВЗРАЧНЫЙ — НЕ пишется слитно с именем прилагательным, которое не употребляется без НЕ."
            ]
        },
        { 
            text: "Укажите варианты ответов, в которых дано верное объяснение написания выделенного слова.",
            options: [
                "ПРИТОРМОЗИТЬ — написание приставки определяется её значением — присоединение.",
                "ЛЬНЯНОЙ — в суффиксе прилагательного, образованного от существительного с помощью суффикса -ЯН-, пишется одна буква Н.",
                "В АКВАРИУМЕ — в форме дательного падежа единственного числа имени существительного 2-го склонения пишется окончание -Е.",
                "НЕ С КЕМ — НЕ с притяжательными местоимениями пишется раздельно.",
                "БЕСШУМНЫЙ — на конце приставки перед буквой, обозначающей глухой согласный, пишется буква С."
            ]
        },
        { 
            text: "Укажите варианты ответов, в которых дано верное объяснение написания выделенного слова.",
            options: [
                "ПО-ПРЕЖНЕМУ (тепло)— написание наречия через дефис определяется наличием приставки ПО- и суффикса -ЕМУ.",
                "ПОТЕРЯТЬ — написание безударной чередующейся гласной в корне определяется наличием суффикса -А-.",
                "НЕ ГОТОВ — частица НЕ с глаголом пишется раздельно.",
                "БЕЗВИННЫЙ — в имени прилагательном, образованном от имени существительного с основой на -Н с помощью суффикса -Н-, пишется НН.",
                "ПРИОСТАНОВИТЬ (работу) — написание приставки определяется её значением — расположение вблизи."
            ]
        },
        { 
            text: "Укажите варианты ответов, в которых дано верное объяснение написания выделенного слова.",
            options: [
                "ИСПЕЧЬ — на конце неопределённой формы глагола после шипящих пишется буква Ь.",
                "ЧЬИ-ТО (следы) — буква Ь обозначает мягкость предыдущего согласного.",
                "ИЗВЕСТНЫЙ — непроизносимая согласная в корне слова проверяется словом известен.",
                "ДОСРОЧНО — в наречии написание суффикса зависит от ударения.",
                "ПРЕГРАЖДАТЬ — написание приставки определяется её значением, близким к слову очень."
            ]
        },
        { 
            text: "Укажите варианты ответов, в которых дано верное объяснение написания выделенного слова.",
            options: [
                "ЗАГОРАТЬ — написание безударной чередующейся гласной в корне определяется наличием суффикса -А-.",
                "НОЧЬЮ (уехать) — в наречии буква Ь указывает на мягкость предшествующего согласного.",
                "РАРИТЕТ — в корне слова пишутся непроверяемые безударные гласные.",
                "ЛЕЛЕЮТ (ребёнка) — в форме настоящего времени 3-го лица множественного числа глагола I спряжения пишется окончание -ЮТ.",
                "КАЛАЧОМ — в суффиксе имени существительного под ударением пишется буква О."
            ]
        },
        { 
            text: "Укажите варианты ответов, в которых дано верное объяснение написания выделенного слова.",
            options: [
                "ВСТРЕЧЕННЫЙ — в полном страдательном причастии прошедшего времени совершенного вида пишется НН.",
                "ПРИПОДНЯТЬ — написание приставки определяется её значением — неполнота действия.",
                "ВЬЮГА — буква Ь обозначает мягкость предшествующего согласного.",
                "ВОСХИЩАТЬСЯ — на конце приставки перед буквой, обозначающей звонкий согласный, пишется буква С.",
                "СОРОКАЛЕТНИЙ — сложное числительное пишется слитно."
            ]
        }
    ];

    const TOTAL = QUESTIONS.length;
    let currentIndex = 0;

    const appDiv = document.getElementById("app");

    function render() {
        const q = QUESTIONS[currentIndex];
        const optionsHtml = q.options.map(opt => `<div class="option-item">• ${opt}</div>`).join('');
        const html = `
            <div class="glass-card">
                <div class="quiz-question">
                    <div class="question-header">
                        <span class="q-num">Вопрос ${currentIndex+1} / ${TOTAL}</span>
                        <span class="q-type">📝 Орфографический анализ</span>
                    </div>
                    <div class="question-text">${q.text}</div>
                    <div class="options-list">${optionsHtml}</div>
                    <div class="nav-buttons">
                        <button id="prevBtn" class="btn" ${currentIndex === 0 ? 'disabled' : ''}>◀ Назад</button>
                        <button id="nextBtn" class="btn btn-primary">${currentIndex === TOTAL-1 ? '🏁 Завершить' : 'Следующий →'}</button>
                    </div>
                    <div class="progress">📌 Запишите номера верных ответов на листочек</div>
                </div>
            </div>
        `;
        appDiv.innerHTML = html;

        document.getElementById("prevBtn")?.addEventListener("click", () => {
            if (currentIndex > 0) {
                currentIndex--;
                render();
            }
        });
        document.getElementById("nextBtn")?.addEventListener("click", () => {
            if (currentIndex < TOTAL - 1) {
                currentIndex++;
                render();
            } else {
                appDiv.innerHTML = `
                    <div class="glass-card" style="text-align:center;">
                        <div style="font-size:1.6rem; font-weight:800;">📋 Готово!</div>
                        <div style="margin:1rem 0;">Вы просмотрели все ${TOTAL} вопросов.</div>
                        <button id="restartBtn" class="btn btn-primary">🔄 Начать заново</button>
                    </div>
                `;
                document.getElementById("restartBtn")?.addEventListener("click", () => {
                    currentIndex = 0;
                    render();
                });
            }
        });
    }

    render();
</script>
</body>
</html>
